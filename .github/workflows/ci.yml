name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:guard
      - name: keyscan PR commits
        if: github.event_name == 'pull_request'
        run: pnpm keyscan --range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      - name: keyscan pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: pnpm keyscan --range ${{ github.event.before }}..${{ github.sha }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: keyscan working tree and build output
        run: pnpm keyscan
      - run: pnpm --filter web exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter web exec playwright test --project=mocked --project=xbrowser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
