name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:guard
      - name: keyscan PR commits
        if: github.event_name == 'pull_request'
        run: pnpm keyscan --range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      - name: keyscan pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: pnpm keyscan --range ${{ github.event.before }}..${{ github.sha }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The grader validation matrix (plan phase P9), offline: canned judge outputs, no key, no
      # live call; a judge cache miss fails the step.
      - name: grader validation matrix
        run: pnpm cli matrix --task _toy
      # The requirement-trace matrix (plan phase P9t): every assignment sentence and user
      # modification has a row with code, tests, a UI screen and action, evidence and an expect.
      - name: requirement trace
        run: pnpm cli trace-check
      - run: pnpm build
      - run: pnpm fixtures:verify
      - name: keyscan working tree and build output
        run: pnpm keyscan

  # Browsers and their system libraries come from the image, so this job installs nothing
  # with apt. The tag must equal @playwright/test in apps/web/package.json
  # (scripts/test/ci-workflow.test.ts fails when they drift).
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # Firefox will not launch as root when $HOME belongs to another user; the runner mounts
      # $HOME owned by uid 1001.
      options: --user 1001
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # playwright.config.ts serves the build with vite preview.
      - run: pnpm build
      - run: pnpm --filter web exec playwright test --project=mocked --project=xbrowser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
