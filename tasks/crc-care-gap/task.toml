# T3 (design section 4, "T3 crc-care-gap"): colorectal screening outreach for the 12-patient
# panel group 'Okafor CRC 2026' (overlay.ts) under RBC-QM-02. The traps are calendar-year
# lookbacks (a 2016 colonoscopy, a 2023 sDNA-FIT, a 2025 FIT), age at the end of the measurement
# period (45 and 75 today), a total colectomy recorded only in a scanned outside operative note,
# frailty with a dementia medication against frailty alone, and an active FIT order already out.
[task]
id = "crc-care-gap"
title = "Colorectal cancer screening outreach for the panel group Okafor CRC 2026 under RBC-QM-02"
# max(80, 3 x oracle steps): the oracle makes 99 tool calls (3 reads, 7 per member, a note
# search, 10 writes and finish), so 297; rechecked against passing trials after the pilot.
max_turns = 297

[[policy]]
id = "RBC-QM-02"
title = "Colorectal cancer screening outreach, 2026"
version = "1"
effective = "2026-01-01"
source = "Adapted from CMS130v14 Colorectal Cancer Screening, eCQI Resource Center, 2026 performance period (https://ecqi.healthit.gov/ecqm/ec/2026/cms0130v14, captured 2026-10-24): initial population 'Patients 46-75 years of age by the end of the measurement period', the numerator lookbacks and the denominator exclusions quoted from that page (verified). Adapted: the panel group replaces 'with a visit during the measurement period'; the local outreach action and the no-duplicate FIT rule are clinic-local. Consistent with USPSTF Colorectal Cancer: Screening, final recommendation released 2021-05-18 (verified)."
file = "rbc-qm-02.md"

# The FIT kit as the clinic's order code and as its LOINC test: either is a FIT order.
[[catalog]]
kind = "lab"
code = "LAB-FIT-KIT"
system = "urn:riverbend:orders"
display = "FIT kit, mailed (fecal immunochemical test for colorectal cancer screening)"
[[catalog]]
kind = "lab"
code = "29771-3"
system = "http://loinc.org"
display = "Hemoglobin [Presence] in Stool from gastrointestinal lower by Immunoassay"

# Each trap needs a mutant in tests/mutants.ts. No status-only case: T3 has no inbox items.
[matrix]
traps = ["colonoscopy_ten_years", "sdna_calendar_year", "age_45_today", "age_75_today", "notes_only_colectomy", "dementia_medication", "frailty_alone", "prior_year_fit", "duplicate_fit_order", "outreach_without_order", "contact_not_needed", "order_before_review"]

# Each judge item reads one row of the final table against a stated status and reason.
[judge]
effort = "medium"
