# T1 (design section 4, "T1 renal-dose-review"): a renal and age dose review of Harold Vance
# (pt-0002, overlay.ts) under RBC-PHARM-07. The traps are the entered-in-error SCr that is the
# latest by date, the stale February SCr and weight, and the pull to keep apixaban at 2.5 mg.
[task]
id = "renal-dose-review"
title = "Renal and age dose review of Harold Vance under RBC-PHARM-07"
max_turns = 80

[[policy]]
id = "RBC-PHARM-07"
title = "Renal and age dose review"
version = "4"
effective = "2026-01-01"
source = "Apixaban section adapted from the FDA label (openFDA SPL effective 2021-06-15; verified). Metformin section: thresholds from the ADA Standards of Care in Diabetes 2026 section 9 (Diabetes Care 49 Suppl 1, December 2025; reduce below eGFR 45, stop below 30; verified), the 1000 mg/day cap from KDIGO 2022 Diabetes in CKD (Kidney Int 102(5S), November 2022; half the maximum dose at eGFR 30-44; cap figure not verified against the guideline text). Gabapentin table environment-local, adapted from label dosing (not verified)."
file = "rbc-pharm-07.md"

