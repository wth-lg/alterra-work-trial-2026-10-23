# T2 (design section 4, "T2 results-inbox"): clearing Dr. Okafor's results inbox of 8 items under
# RBC-INBOX-01 and the policies it references (overlay.ts). The traps are the CT nodule whose
# smoking history is only in the H&P and whose interval runs from the index study, a second
# patient of the same name, an existing GI referral, the hemolyzed potassium beside a true
# critical one and the urgent recommendation with no stated interval.
[task]
id = "results-inbox"
title = "Close the loop on Dr. Okafor's results inbox"
max_turns = 80

[[policy]]
id = "RBC-INBOX-01"
title = "Results inbox"
version = "1"
effective = "2026-01-01"
source = "Environment-local."
file = "rbc-inbox-01.md"

[[policy]]
id = "RBC-RAD-05"
title = "Follow-up of radiology recommendations"
version = "1"
effective = "2026-01-01"
source = "Section 2 adapted from the Fleischner Society 2017 guidelines (MacMahon H et al., Radiology 2017;284(1):228-243, Table 1A: single solid nodule <6 mm, low risk 'No routine follow-up', high risk 'Optional CT at 12 months'; verified), made a required CT for high risk, with the 20 pack-year and 15-year quit numbers of the USPSTF 2021 lung cancer screening recommendation (JAMA 2021;325(10):962-970, released 2021-03-09; verified) in place of Fleischner's 30 pack-years. USPSTF combines them: 'a 20 pack-year smoking history and currently smoke or have quit within the past 15 years'. RBC-RAD-05's high-risk rule is local and broader: 20 or more pack-years, or quit within 15 years, or any current smoking is high risk on its own. Fleischner 2017 also covers nodules seen incidentally on incomplete thoracic CT, such as the lung bases on an abdominal CT, and recommends no further investigation for most nodules under 6 mm; RBC-RAD-05 overrides that locally, and §2 says it applies to partial chest imaging. Sections 1, 3 and 4 environment-local."
file = "rbc-rad-05.md"

[[policy]]
id = "RBC-GI-01"
title = "Positive stool test for colorectal cancer"
version = "1"
effective = "2026-01-01"
source = "Section 1 from the USPSTF 2021 colorectal cancer screening recommendation (JAMA 2021;325(19):1965-1977, released 2021-05-18: 'Positive results on stool-based screening tests require follow-up with colonoscopy'; verified). Section 2 environment-local."
file = "rbc-gi-01.md"

[[policy]]
id = "RBC-LAB-03"
title = "Potassium results"
version = "1"
effective = "2026-01-01"
source = "Environment-local: the 6.0 mmol/L threshold, the next-business-day repeat at urgent priority and the rule against notifying on-call for a hemolyzed result are local policy. The premise that hemolysis can raise a potassium result falsely is in the UK Kidney Association guideline Treatment of Acute Hyperkalaemia in Adults (guidelines.ukkidney.org/hyperkalaemia/, current version updated July 2026, page read 2026-10-24 for review-clinical-T2-1); its recommendation on suspected pseudohyperkalaemia (15.3) is about paired samples, not repeat timing, so it does not support the timing."
file = "rbc-lab-03.md"

